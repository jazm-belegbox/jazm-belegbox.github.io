<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E6A5B" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1412" media="(prefers-color-scheme: dark)">
<meta name="description" content="Abos, Verträge, Geräte und Belege – verschlüsselt auf deinem Handy.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; worker-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Belegbox</title>
<style>
/* Layout: eine schmale App-Spalte, Tabs unten wie eine Handy-App, Details als Bottom-Sheet */
:root{
  --bg:#EDF1F0; --surface:#FFFFFF; --sunk:#E3E9E7; --ink:#14211F; --muted:#5A6A67; --line:#D3DCDA;
  --accent:#0E6A5B; --accent-ink:#FFFFFF; --accent-soft:#D6EAE5;
  --warn:#9C560A; --warn-soft:#FBEAD3; --crit:#B3261E; --crit-soft:#F8DDDA; --ok:#2C7536; --ok-soft:#DDEFDD;
  --f-display:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-body:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono:ui-monospace, "Roboto Mono", "SF Mono", Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1412; --surface:#16201D; --sunk:#111A18; --ink:#E3ECE9; --muted:#93A49F; --line:#27342F;
  --accent:#55C4AD; --accent-ink:#06231D; --accent-soft:#16392F;
  --warn:#F0A64B; --warn-soft:#3A2913; --crit:#F2897F; --crit-soft:#3F1C19; --ok:#7DCB88; --ok-soft:#173220;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1412; --surface:#16201D; --sunk:#111A18; --ink:#E3ECE9; --muted:#93A49F; --line:#27342F;
  --accent:#55C4AD; --accent-ink:#06231D; --accent-soft:#16392F;
  --warn:#F0A64B; --warn-soft:#3A2913; --crit:#F2897F; --crit-soft:#3F1C19; --ok:#7DCB88; --ok-soft:#173220;
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{color-scheme:light;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh}
img{max-width:100%}
.upd{position:fixed;z-index:30;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));
  display:flex;align-items:center;gap:6px 12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:8px 8px 8px 14px;font-size:14px;width:max-content;max-width:calc(100% - 32px);box-shadow:0 6px 18px rgba(10,40,35,.18)}
.upd #updGo{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:6px 12px;font-weight:700}
.upd #updX{background:none;border:0;color:var(--muted);padding:6px}
html{padding-top:env(safe-area-inset-top,0px)}
body{-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-weight:800}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));
  padding-block:0 calc(160px + env(safe-area-inset-bottom,0px))}
.app{max-width:720px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:20px 8px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center}
.mark svg{width:20px;height:20px}
.brand h1{font-size:24px}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;color:var(--muted)}

.banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;justify-content:space-between;
  background:var(--accent-soft);border-radius:var(--r);padding:10px 14px;margin-block:8px 4px;font-size:14px}
.banner button{background:none;border:0;color:var(--accent);font-weight:700;padding:4px 0;text-decoration:underline;text-underline-offset:3px}

section.view{display:flex;flex-direction:column;gap:22px;padding-block:14px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sechead h2{font-size:20px}

/* Summary */
.summary{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:16px}
.bigcost{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.bigcost .num{font-size:clamp(34px,9vw,44px);font-weight:500;letter-spacing:-.02em;line-height:1.1}
.bigcost small{color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;border-top:1px solid var(--line);padding-top:14px}
.facts div{min-width:0}
.facts b{display:block;font-family:var(--f-mono);font-weight:500;font-size:18px}
.facts span{font-size:13px;color:var(--muted)}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:7.5em 1fr auto;align-items:center;gap:10px;font-size:14px}
.bar .track{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:99px}
.bar .num{font-size:13px;color:var(--muted)}

/* Lists */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 14px;
  background:none;border:0;border-top:1px solid var(--line);text-align:left;width:100%}
.row:first-child{border-top:0}
.row:hover{background:var(--sunk)}
.row .t{font-weight:700;overflow-wrap:anywhere}
.row .s{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row{align-items:start}
.row .main{min-width:0;display:grid;gap:2px}
.row .pl{margin-top:4px}
.row .amt{white-space:nowrap;font-size:15px;padding-top:2px;text-align:right}
.row .amt small{display:block;font-size:11px;color:var(--muted);font-family:var(--f-body)}
.row .tile,.row .date{align-self:center}
.tile{width:40px;height:40px;border-radius:10px;background:var(--sunk);display:grid;place-items:center;
  font-family:var(--f-display);font-weight:700;color:var(--accent);overflow:hidden}
.tile img{width:100%;height:100%;object-fit:cover}
.date{width:46px;text-align:center;border-radius:10px;padding:4px 0;background:var(--sunk);line-height:1.15}
.date b{display:block;font-family:var(--f-mono);font-weight:500;font-size:18px}
.date span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.empty{padding:22px 16px;color:var(--muted);font-size:14px;text-align:center}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:99px;padding:2px 9px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)}
.p-crit{background:var(--crit-soft);color:var(--crit)} .p-none{background:var(--sunk);color:var(--muted)}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Tabbar + FAB */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px, env(safe-area-inset-left,0px));padding-right:max(8px, env(safe-area-inset-right,0px))}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs button{background:none;border:0;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted)}
nav.tabs svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
.fab{position:fixed;z-index:21;right:max(18px, calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(78px + env(safe-area-inset-bottom,0px));
  background:var(--accent);color:var(--accent-ink);border:0;border-radius:16px;padding:14px 18px;font-weight:700;
  display:flex;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(10,40,35,.25)}
.fab svg{width:20px;height:20px}

/* Sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(5,15,12,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:720px;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;
  padding:8px max(18px, env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px, env(safe-area-inset-right,0px))}
.grab{width:40px;height:4px;border-radius:99px;background:var(--line);margin:4px auto 12px}
.sheethead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.sheethead h2{font-size:22px}
.x{background:var(--sunk);border:0;border-radius:99px;width:34px;height:34px;flex:none;font-size:18px;line-height:1}
dl.kv{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr);gap:8px 14px;margin:0 0 16px}
dl.kv dt{color:var(--muted);font-size:14px} dl.kv dd{margin:0;overflow-wrap:anywhere}
.photo{width:100%;max-height:260px;object-fit:contain;background:var(--sunk);border-radius:12px;margin-bottom:14px}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:700}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--crit)} .btn.danger.sure{background:var(--crit);color:var(--surface);border-color:var(--crit)}

form{display:grid;gap:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:12px;padding:4px}
.seg button{border:0;background:none;border-radius:9px;padding:8px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{display:grid;gap:4px;min-width:0}
.field>span{font-size:13px;color:var(--muted);font-weight:700}
.field input,.field select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;min-width:0}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.hint{font-size:13px;color:var(--muted);margin:0}
body.locked .fab,body.locked nav.tabs,body.locked .app{display:none}
.lock{min-height:100%;display:flex;align-items:center;justify-content:center;padding-block:48px 24px}
.lockcard{width:100%;max-width:420px;display:grid;gap:16px}
.lockcard h2{font-size:28px}
.lockcard p{margin:0;color:var(--muted)}
.shield{width:56px;height:56px;border-radius:16px;background:var(--accent);display:grid;place-items:center}
.shield svg{width:30px;height:30px}
.note{background:var(--warn-soft);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:14px}
.btn.bio{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px 16px}
.btn.bio svg{width:24px;height:24px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:6px 0;font-size:14px;justify-self:center}
.linkbtn.sure{color:var(--crit);font-weight:700}
.reveal{background:none;border:0;color:var(--accent);font-weight:700;font-size:13px;padding:0 0 0 8px}
.secline{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:14px}
.secline svg{width:16px;height:16px;flex:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:70;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;width:max-content;max-width:calc(100% - 32px)}
@media (max-width:420px){.facts{grid-template-columns:1fr 1fr}.facts div:last-child{grid-column:1/-1}.bar{grid-template-columns:6.5em 1fr auto}}

/* ---------- Bewegung & Gesten (0.4) ---------- */
:root{--ease:cubic-bezier(.2,.85,.25,1);--spring:cubic-bezier(.3,1.35,.5,1);--gold:#C99A06;--shine:rgba(255,255,255,.7)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--gold:#E8C04A;--shine:rgba(255,255,255,.2)}}
:root[data-theme="dark"]{--gold:#E8C04A;--shine:rgba(255,255,255,.2)}
html{overscroll-behavior-y:contain}
.app{touch-action:pan-y pinch-zoom}
main{will-change:auto}

/* Tippen fühlt sich an */
.row{transition:transform .16s var(--ease),background-color .16s}
.row:active{transform:scale(.985);background:var(--sunk)}
.btn,.chip,.ghost,.x{transition:transform .14s var(--ease),background-color .2s,color .2s}
.btn:active,.chip:active,.ghost:active,.x:active{transform:scale(.95)}

/* Tab-Leiste mit gleitender Markierung */
nav.tabs .in{position:relative}
nav.tabs button{position:relative;z-index:1}
nav.tabs .ind{position:absolute;left:0;top:6px;width:calc(100% / 3);height:30px;display:flex;justify-content:center;pointer-events:none;
  transform:translateX(calc(var(--ti,0) * 100%));transition:transform .45s var(--spring)}
nav.tabs .ind::before{content:"";width:60px;height:100%;border-radius:99px;background:var(--accent-soft)}
nav.tabs .ind.drag{transition:none}
nav.tabs button[aria-current="page"] svg{animation:pop .45s var(--spring)}
@keyframes pop{0%{transform:scale(.6)}}

/* Neu-Knopf als Fächer */
.fab{z-index:24;gap:0;transition:transform .16s var(--ease),border-radius .3s var(--ease)}
.fab:active{transform:scale(.94)}
.fab .plus{transition:transform .4s var(--spring)}
.fab .lbl{display:inline-block;max-width:4em;margin-left:8px;overflow:hidden;white-space:nowrap;transition:max-width .28s var(--ease),margin .28s var(--ease),opacity .2s}
.fab.open{border-radius:50%}
.fab.open .plus{transform:rotate(135deg)}
.fab.open .lbl{max-width:0;margin-left:0;opacity:0}
.fan{position:fixed;inset:0;z-index:22}
.fan .fs{position:absolute;inset:0;background:rgba(5,15,12,.32);opacity:0;transition:opacity .22s}
.fan.show .fs{opacity:1}
.fan .fi{position:absolute;right:max(18px, calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(142px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.fan .fi button{display:flex;align-items:center;gap:10px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;
  padding:11px 16px;font-weight:700;box-shadow:0 8px 22px rgba(10,40,35,.2);opacity:0;transform:translateY(22px) scale(.6);transform-origin:right bottom;
  transition:opacity .16s,transform .22s ease-in;transition-delay:calc((2 - var(--n)) * 25ms)}
.fan.show .fi button{opacity:1;transform:none;transition:opacity .2s,transform .42s var(--spring);transition-delay:calc(var(--n) * 50ms)}
.fan .fi svg{width:20px;height:20px;color:var(--accent);flex:none}
body.locked .fan{display:none}

/* Bottom-Sheet: Scrim blendet mit, Fenster lässt sich nach unten ziehen */
.scrim{background:rgba(5,15,12,calc(.45 * var(--k,1)));transition:background-color .28s;animation:scrimIn .3s ease-out}
.scrim.swap{animation:none}
.scrim.drag{transition:none}
.scrim.closing{pointer-events:none}
@keyframes scrimIn{from{background-color:rgba(5,15,12,0)}}
.sheet{overscroll-behavior:contain;touch-action:pan-y}
.grab{width:44px;height:5px;margin:4px auto 12px;transition:background-color .2s,width .2s var(--ease)}
.scrim.drag .grab{background:var(--muted);width:56px}

/* Zum Aktualisieren ziehen */
.ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:25;width:42px;height:42px;margin-left:-21px;border-radius:50%;
  background:var(--surface);border:1px solid var(--line);box-shadow:0 6px 16px rgba(10,40,35,.2);display:grid;place-items:center;color:var(--muted);
  transform:translateY(-70px);opacity:0;pointer-events:none;transition:background-color .15s,color .15s}
.ptr svg{width:22px;height:22px}
.ptr.armed{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ptr.spin svg{animation:spin .75s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Garantie-Ringe */
.tw{position:relative;width:46px;height:46px;display:grid;place-items:center;align-self:center}
.row .tw .tile,.tw .tile{width:36px;height:36px;border-radius:50%;font-size:15px}
.ring{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ring .trk{fill:none;stroke:var(--sunk)}
.ring .arc{fill:none;stroke-linecap:round}
.prot{display:flex;align-items:center;gap:14px;margin:0 0 16px;padding:12px 14px;background:var(--sunk);border-radius:14px}
.prot .rw{position:relative;width:60px;height:60px;flex:none;display:grid;place-items:center;font-size:14px}
.prot b{display:block}
.prot .hint{display:block}
.prev{background:var(--accent-soft);border-radius:12px;padding:10px 14px;font-size:14px;display:grid;gap:2px}
.prev:empty{display:none}
.tile.logo{background:#fff;border:1px solid var(--line)}
.tile.logo img{object-fit:contain;padding:4px}
.hlogo{width:34px;height:34px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:9px;padding:3px;vertical-align:middle;margin:-4px 10px 0 0}
.logofield{display:flex;align-items:flex-end;gap:12px}
.logofield .tile{flex:none;width:44px;height:44px;margin-bottom:2px}
.logofield .reveal{padding-bottom:12px}
/* Belege & Dokumente */
.doclist{display:grid;gap:8px}
.doclist:empty{display:none}
.docrow{display:flex;align-items:center;gap:10px}
.dbtn{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:var(--sunk);border:0;border-radius:12px;padding:8px 12px 8px 8px;text-align:left;color:inherit}
button.dbtn{transition:transform .15s var(--ease)}button.dbtn:active{transform:scale(.98)}
.dthumb{width:42px;height:54px;flex:none;border-radius:6px;background:#fff;border:1px solid var(--line);overflow:hidden;display:grid;place-items:center;font-size:10px;font-weight:800;color:#B3261E}
.dthumb img{width:100%;height:100%;object-fit:cover;object-position:top}
.dmain{min-width:0;flex:1;display:grid}
.dmain b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.dmain span{font-size:12px;color:var(--muted)}
.dgo{font-size:13px;font-weight:700;color:var(--accent);flex:none}
.docadd{display:inline-flex;align-items:center;gap:8px;justify-self:start;cursor:pointer}
.spin{width:18px;height:18px;flex:none;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite;display:inline-block}
.viewer{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.vhead{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.vhead b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vhead .ghost[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.vbody{flex:1;overflow:auto;padding:8px 8px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;align-items:flex-start;overscroll-behavior:contain}
.vbody canvas,.vbody img{display:block;width:100%;height:auto;max-width:none;background:#fff;border-radius:4px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.vbody.z2 canvas,.vbody.z2 img{width:200%}
.vload{margin:auto;color:var(--muted);display:flex;gap:10px;align-items:center;text-align:center;padding:24px;max-width:340px}
.prev .label{margin-bottom:2px}

/* Tresor auf dem Sperrbildschirm */
#lock:not(:empty){position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;
  padding:env(safe-area-inset-top,0px) max(16px, env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px, env(safe-area-inset-left,0px))}
#lock.leaving{pointer-events:none}
.vault{width:74px;height:74px;border-radius:21px;background:var(--accent);position:relative;perspective:240px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.16)}
.vault::before{content:"";position:absolute;inset:8px;border-radius:50%;
  background:radial-gradient(circle at 50% 45%, var(--accent-soft) 0 22%, color-mix(in srgb, var(--accent) 45%, #000) 78%);box-shadow:inset 0 2px 7px rgba(0,0,0,.45)}
.vault .door{position:absolute;inset:8px;transform-origin:0 50%;transition:transform .5s cubic-bezier(.5,0,.15,1) 0s}
.vault .door svg{display:block;width:100%;height:100%;overflow:visible}
.vault .face{fill:color-mix(in srgb, var(--accent) 80%, #fff);stroke:var(--accent-ink);stroke-opacity:.45;stroke-width:1.5}
.vault .bolt{fill:var(--accent-ink);opacity:.5}
.vault .wheel{fill:none;stroke:var(--accent-ink);stroke-width:2.6;stroke-linecap:round;transform-box:fill-box;transform-origin:center;
  transition:transform .45s cubic-bezier(.3,.1,.2,1) .42s}
.vault .wheel .knob{fill:var(--accent-ink);stroke:none}
.vault.open .door{transform:rotateY(-112deg);transition-delay:.3s}
.vault.open .wheel{transform:rotate(270deg);transition-delay:0s}
.vault.busy .wheel{animation:spin 1.4s cubic-bezier(.5,0,.5,1) infinite}
.vault.instant .door,.vault.instant .wheel{transition:none}
.vault.no{animation:shake .42s}
.field.no input{animation:shake .42s;border-color:var(--crit)}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}

/* Haken-Animation */
.yay{position:fixed;inset:0;z-index:90;display:grid;place-items:center;pointer-events:none}
.yay .card{position:relative;background:var(--surface);border-radius:24px;padding:22px 28px 16px;display:grid;justify-items:center;gap:8px;min-width:150px;
  box-shadow:0 18px 50px rgba(10,40,35,.3);animation:yayIn .45s var(--spring) both,yayOut .28s ease-in 1.2s forwards}
.yay svg{width:64px;height:64px}
.yay .yc{fill:none;stroke:var(--ok);stroke-width:3;stroke-dasharray:145;stroke-dashoffset:145;animation:ink .45s ease-out .08s forwards}
.yay .yk{fill:none;stroke:var(--ok);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:34;stroke-dashoffset:34;animation:ink .28s ease-out .42s forwards}
.yay b{font-size:15px}
.yay i{position:absolute;left:50%;top:54px;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:var(--c);opacity:0;animation:spark .65s ease-out .5s}
@keyframes ink{to{stroke-dashoffset:0}}
@keyframes spark{0%{opacity:1;transform:rotate(var(--a)) translateY(-30px) scale(1)}100%{opacity:0;transform:rotate(var(--a)) translateY(-64px) scale(.3)}}
@keyframes yayIn{from{opacity:0;transform:scale(.6)}}
@keyframes yayOut{to{opacity:0;transform:scale(.92)}}

/* Kippen & Glanz (nur wenn das Handy Lagedaten liefert) */
.summary{position:relative;overflow:hidden}
.summary::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;opacity:0;
  background:radial-gradient(circle at calc(50% - var(--tx,0) * 70%) calc(35% - var(--ty,0) * 70%), var(--shine), transparent 60%)}
html.tilt .summary::after{opacity:calc(var(--gm,0) * .55)}
html.tilt .summary,html.tilt .tiltme{transform:perspective(900px) rotateX(calc(var(--ty,0) * -4deg)) rotateY(calc(var(--tx,0) * 4deg))}
html.tilt .p-ok{background-image:linear-gradient(100deg,transparent 35%,var(--shine) 50%,transparent 65%);background-size:300% 100%;background-repeat:no-repeat;
  background-position:calc(4% + var(--gm,0) * 46% - var(--tx,0) * 8%) 0}

@media (prefers-reduced-motion:no-preference){
  .toast{animation:toastIn .38s var(--spring)}
  .toast.out{animation:toastOut .2s ease-in forwards}
  .upd{animation:updIn .45s var(--spring)}
  .view.rise>*{animation:rise .5s var(--ease) backwards;animation-delay:calc(var(--i,0) * 55ms)}
  .view.rows .list>.row{animation:rise .42s var(--ease) backwards;animation-delay:calc(60ms + var(--j,0) * 35ms)}
  .view.enter .bar .fill{transform-origin:left;animation:grow .9s var(--ease) backwards;animation-delay:.18s}
  .enter .ring .arc{animation:draw 1s cubic-bezier(.3,.7,.2,1) backwards;animation-delay:calc(180ms + var(--j,0) * 40ms)}
}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,18px) scale(.94)}}
@keyframes toastOut{to{opacity:0;transform:translate(-50%,10px) scale(.97)}}
@keyframes updIn{from{opacity:0;transform:translate(-50%,-24px)}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes draw{from{stroke-dashoffset:var(--c)}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:1ms!important;transition-delay:0s!important;animation-duration:1ms!important;animation-delay:0s!important;animation-iteration-count:1!important}
  html.tilt .summary,html.tilt .tiltme{transform:none}
}
</style>
</head>
<body>
